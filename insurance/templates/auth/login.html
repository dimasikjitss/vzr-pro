<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему | VZR GSO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center bg-blue-600 p-3 rounded-2xl shadow-lg shadow-blue-200 mb-4">
                <i data-lucide="shield-check" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">VZR <span class="text-blue-600">GSO</span></h1>
            <p class="text-slate-500 mt-2">Система оформления страховых полисов</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200 border border-slate-100 p-8">
            <h2 class="text-xl font-semibold text-slate-800 mb-6">Авторизация</h2>

            {% if form.errors %}
            <div class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 rounded-md">
                <p class="text-sm text-red-700">Неверный логин или пароль. Попробуйте снова.</p>
            </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Логин</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="text-slate-400 w-5 h-5"></i>
                        </div>
                        <input type="text" name="username" required 
                               class="block w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none text-slate-700"
                               placeholder="Введите ваш логин">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Пароль</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="text-slate-400 w-5 h-5"></i>
                        </div>
                        <input type="password" name="password" required 
                               class="block w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none text-slate-700"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition-all flex items-center justify-center gap-2 group">
                        Войти в систему
                        <i data-lucide="arrow-right" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-slate-400 text-sm mt-8">
            &copy; 2026 Insurance Solutions. <br>
            Все права защищены.
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
